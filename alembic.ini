[alembic]
script_location = alembic
prepend_sys_path = .

# L'URL de connexion n'est PAS définie ici : alembic/env.py la lit depuis
# config.DATABASE_URL (donc depuis la variable d'environnement DATABASE_URL),
# exactement comme le reste de l'application. Ne jamais coder une URL avec
# des identifiants ici.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
